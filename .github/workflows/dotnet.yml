# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Wait for SQL Server
      run: |
        for i in $(seq 1 60); do
          if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
            echo "SQL Server is listening (attempt $i)"
            break
          fi
          echo "Waiting for SQL Server (attempt $i)..."
          sleep 2
        done
        sleep 15
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env:
        TEST_DATABASE_CONNECTION: "Server=localhost,1433;Database=ClinicaNutricional;User Id=sa;Password=YourStrong@Passw0rd;MultipleActiveResultSets=True;TrustServerCertificate=True"
      run: dotnet test --no-build --verbosity normal
    defaults:
      run:
        working-directory: GestionClinicaNutricionalService
